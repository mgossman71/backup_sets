<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}{% endblock %} · Backup Sets</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}?v={{ asset_v }}">
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}?v={{ asset_v }}" type="image/svg+xml">
  <link rel="icon" href="{{ url_for('static', filename='favicon-32.png') }}?v={{ asset_v }}" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}?v={{ asset_v }}">
  <meta name="theme-color" content="#2a78d6">
</head>
<body data-page="{{ page }}">
  <header class="topbar">
    <a class="brand" href="{{ url_for('portal.dashboard') }}"><img class="brand-mark" src="{{ url_for('static', filename='favicon.svg') }}?v={{ asset_v }}" alt="" width="20" height="20">Backup Sets</a>
    <nav aria-label="Main">
      <a href="{{ url_for('portal.dashboard') }}" {% if page == 'dashboard' %}aria-current="page"{% endif %}>Dashboard</a>
      <a href="{{ url_for('portal.selections') }}" {% if page == 'selections' %}aria-current="page"{% endif %}>Backup selections</a>
      <a href="{{ url_for('portal.history_page') }}" {% if page == 'history' %}aria-current="page"{% endif %}>History</a>
      <a href="{{ url_for('portal.filesystems_page') }}" {% if page == 'filesystems' %}aria-current="page"{% endif %}>Filesystems</a>
    </nav>
    <div class="user">
      <span>{{ user }}</span>
      <form method="post" action="{{ url_for('portal.logout') }}">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <button class="link" type="submit">Sign out</button>
      </form>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <script src="{{ url_for('static', filename='app.js') }}?v={{ asset_v }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
