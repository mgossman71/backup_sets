<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Backup Sets</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3987e5"/>
      <stop offset="1" stop-color="#1c5cab"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- stacked storage disks -->
  <clipPath id="drive"><path d="M14 17c0-4.4 8.1-8 18-8s18 3.6 18 8v30c0 4.4-8.1 8-18 8s-18-3.6-18-8z"/></clipPath>
  <path fill="#fff" d="M14 17c0-4.4 8.1-8 18-8s18 3.6 18 8v30c0 4.4-8.1 8-18 8s-18-3.6-18-8z"/>
  <g fill="none" stroke="#1c5cab" stroke-width="3.2" clip-path="url(#drive)">
    <path d="M14 17c0 4.4 8.1 8 18 8s18-3.6 18-8"/>
    <path d="M14 28c0 4.4 8.1 8 18 8s18-3.6 18-8"/>
    <path d="M14 39c0 4.4 8.1 8 18 8s18-3.6 18-8"/>
  </g>
  <!-- green "backed up" check badge -->
  <circle cx="48" cy="48" r="12" fill="#0ca30c" stroke="#fff" stroke-width="3"/>
  <path d="M42.5 48.2l3.8 3.8 7.2-7.6" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
