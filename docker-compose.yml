# Backup Sets web portal.  Install the host side first:  sudo bash host/install.sh
services:
  backup-portal:
    build: ./portal
    image: backup-portal:latest
    container_name: backup-portal
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment:
      ALLOWED_GROUP: sudo          # members of this host group may sign in
      ALLOWED_USERS: root          # plus these users (comma-separated)
      BROWSE_ROOTS: /mnt           # folder browser is limited to these trees
      TZ: America/Chicago          # display only; schedules follow the host's /etc/localtime
      TMPDIR: /tmp
    # Hardening: if the web app were ever compromised, limit what it can do.
    # It runs as root (it must read /etc/shadow for logins) but with every Linux capability
    # dropped, so it can only read files root owns or that are readable by everyone.
    # If folder sizes under /mnt ever show "permission denied", add:
    #     cap_add: [DAC_READ_SEARCH]
    # (that also lets it read other users' private files, so only add it if needed).
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    volumes:
      # Host filesystem, read-only: df, mount table, flag files, log, account files
      - type: bind
        source: /
        target: /host
        read_only: true
        bind:
          propagation: rslave
      # Config (edited by the portal) and portal state (history, requests, TLS, db)
      - /opt/backup_sets:/opt/backup_sets
      - /var/lib/backup_sets:/var/lib/backup_sets
