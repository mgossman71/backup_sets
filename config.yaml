# Backup Configuration File
# Edit this file to configure your backup settings

# Log file location
log_file: /var/log/backup_sets.log

# Rsync options (space-separated)
# -a: archive mode, -v: verbose, --progress: show file-by-file progress, --stats: show statistics
rsync_opts: "-av --progress --stats"

# Flag files
# Customize these to allow multiple instances of backup.sh to run simultaneously
# Each instance should use a unique set of flag file names/locations
running_flag: /mnt/.backup_running
fail_flag: /mnt/.backup_failed
stop_flag: /mnt/.backup_stop

# Backup mappings
# Each entry maps a source directory to a destination directory
# The folder name from the source will be created in the destination
backups:    
  - source: /mnt/SharedVol/Movies
    destination: /mnt/usb_chassis/pool

  - source: /mnt/SharedVol/Data
    destination: /mnt/usb_chassis/singleusb

  - source: /mnt/SharedVol/TV-Shows
    destination: /mnt/usb_chassis/singleusb

# To add new backups from different sources, add more entries:
#  - source: /mnt/OtherVol/Photos
#    destination: /mnt/usb_chassis/disk5
#
#  - source: /home/data/Documents
#    destination: /mnt/usb_chassis/disk6